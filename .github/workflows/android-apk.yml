name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "js/**"
      - "css/**"
      - "index.html"
      - "icons/**"
      - "tools/build-android-assets.mjs"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 数据自检
        run: |
          node -e "const s=require('fs').readFileSync('js/data.js','utf8');
          const n=(s.match(/\"qno\":/g)||[]).length;
          console.log('题目数', n);
          if(n < 100) { console.error('题目数异常'); process.exit(1); }"

      - name: 准备签名密钥
        run: |
          : > android/keystore.p12
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > android/keystore.p12
          fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: 构建 APK
        run: bash android/build-apk.sh

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dati408-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: 首次生成的签名密钥留档
        run: |
          if [ -f .build-android/dati.keystore ]; then
            cp .build-android/dati.keystore dist/dati.keystore
          fi

      - name: 上传签名密钥（仅一次性密钥时存在）
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: dist/dati.keystore
          if-no-files-found: ignore
